<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Coach marketing shots</title>
<style>
  :root { --bg:#101214; --card:#1c2126; --text:#f4f6f8; --dim:#a7adb4; --accent:#C7F36B; --line:#2c333a; }
  * { box-sizing: border-box; }
  body { margin:0; background:#070809; color:var(--text); font-family: ui-sans-serif, system-ui, sans-serif; }
  .frame { width:390px; height:844px; background:var(--bg); margin:0 auto; display:flex; flex-direction:column; overflow:hidden; }
  .caption { padding:28px 24px 8px; }
  .caption h1 { margin:0; font-size:28px; line-height:1.15; letter-spacing:-.03em; }
  .caption p { margin:8px 0 0; color:var(--dim); font-size:15px; }
  .phone { margin:16px 18px 0; background:#181c20; border:1px solid var(--line); border-radius:28px 28px 0 0; padding:22px 16px 24px; flex:1; }
  .hello { font-size:13px; color:var(--dim); }
  .name { font-size:26px; font-weight:750; margin:4px 0 12px; }
  .chip { display:inline-block; background:#242a22; color:var(--accent); border-radius:999px; padding:6px 10px; font-size:12px; font-weight:700; }
  .card { background:var(--card); border-radius:16px; padding:14px; margin-top:12px; }
  .row { display:flex; justify-content:space-between; gap:8px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .ex { font-weight:650; }
  .meta { color:var(--dim); font-size:12px; }
  .bar { height:8px; background:#2a3036; border-radius:99px; overflow:hidden; margin-top:8px; }
  .bar span { display:block; height:100%; width:60%; background:var(--accent); }
  .pill { margin-top:14px; background:var(--accent); color:#101214; text-align:center; font-weight:800; border-radius:999px; padding:12px; }
  .meal { font-size:14px; }
  .kcal { color:var(--accent); font-weight:700; }
</style>
</head>
<body>
<div class="frame" id="shot"></div>
<script>
const q = new URLSearchParams(location.search);
const lang = q.get('lang') === 'el' ? 'el' : 'en';
const shot = q.get('shot') || 'home';
const copy = {
  en: {
    homeCap: 'Your week, at a glance',
    homeSub: 'Streak and workouts done, with a real name.',
    hello: 'Good evening',
    name: 'Maria',
    chip: '4-day streak · 3/4 this week',
    today: 'Upper body',
    next: 'Bench press',
    nextMeta: '4 × 6-8 · next',
    cta: 'Continue workout',
    trainCap: 'A session you can finish',
    trainSub: 'Four exercises. Main lift first.',
    mealsCap: 'Calories without the guesswork',
    mealsSub: 'Greek and Mediterranean ideas, with portions.',
    meal1: 'Greek yogurt, honey, walnuts',
    meal2: 'Chicken, olive oil, salad, bread',
    meal3: 'Lentil soup and feta',
    target: '1,840 kcal · 120 g protein'
  },
  el: {
    homeCap: 'Η εβδομάδα σου, με μια ματιά',
    homeSub: 'Σειρά ημερών και προπονήσεις, με πραγματικό όνομα.',
    hello: 'Καλησπέρα',
    name: 'Μαρία',
    chip: 'Σειρά 4 ημερών · 3/4 αυτή την εβδομάδα',
    today: 'Πάνω μέρος',
    next: 'Πάγκος με μπάρα',
    nextMeta: '4 × 6-8 · επόμενο',
    cta: 'Συνέχεια προπόνησης',
    trainCap: 'Συνεδρία που προλαβαίνεις',
    trainSub: 'Τέσσερις ασκήσεις. Πρώτα η βασική.',
    mealsCap: 'Θερμίδες χωρίς μαντεψιά',
    mealsSub: 'Ελληνικές και μεσογειακές ιδέες, με μερίδες.',
    meal1: 'Γιαούρτι, μέλι, καρύδια',
    meal2: 'Κοτόπουλο, ελαιόλαδο, σαλάτα, ψωμί',
    meal3: 'Φακές και φέτα',
    target: '1.840 kcal · 120 g πρωτεΐνη'
  }
}[lang];
const exercises = lang === 'el'
  ? [['Πάγκος με μπάρα','4 × 6-8'],['Κωπηλατική','4 × 8-10'],['Πιέσεις ώμων','3 × 10'],['Δικέφαλος','3 × 10']]
  : [['Flat bench press','4 × 6-8'],['Dumbbell row','4 × 8-10'],['Shoulder press','3 × 10'],['Barbell curl','3 × 10']];
function home() {
  return `<div class="caption"><h1>${copy.homeCap}</h1><p>${copy.homeSub}</p></div>
    <div class="phone"><div class="hello">${copy.hello}</div><div class="name">${copy.name}</div>
    <div class="chip">${copy.chip}</div>
    <div class="card"><div class="meta">${copy.today}</div><div class="ex">${copy.next}</div><div class="meta">${copy.nextMeta}</div><div class="bar"><span></span></div></div>
    <div class="pill">${copy.cta}</div></div>`;
}
function train() {
  const rows = exercises.map(([n,m]) => `<div class="row"><div class="ex">${n}</div><div class="meta">${m}</div></div>`).join('');
  return `<div class="caption"><h1>${copy.trainCap}</h1><p>${copy.trainSub}</p></div>
    <div class="phone"><div class="name">${copy.today}</div><div class="card">${rows}</div></div>`;
}
function meals() {
  return `<div class="caption"><h1>${copy.mealsCap}</h1><p>${copy.mealsSub}</p></div>
    <div class="phone"><div class="chip">${copy.target}</div>
    <div class="card meal"><div class="row"><span>${copy.meal1}</span><span class="kcal">320</span></div>
    <div class="row"><span>${copy.meal2}</span><span class="kcal">640</span></div>
    <div class="row"><span>${copy.meal3}</span><span class="kcal">480</span></div></div></div>`;
}
const views = { home, train, meals };
document.getElementById('shot').innerHTML = (views[shot] || home)();
</script>
</body>
</html>
