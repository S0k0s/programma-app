<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
  :root{ --bg:#101214; --surface:#191D20; --surface2:#20262A; --line:#272d31; --text:#F4F5EE;
    --text-dim:#8E9795; --lime:#C7F36B; --danger:#F08270; --success:#82D69B; --amber:#D9A441; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,'Inter',sans-serif;}
  .wrap{max-width:1100px;margin:0 auto;padding:32px 20px 60px;}
  h1{font-size:20px;margin:0 0 4px;}
  .sub{color:var(--text-dim);font-size:13px;margin:0 0 20px;}
  button{font-family:inherit;cursor:pointer;border-radius:99px;padding:10px 18px;font-size:14px;font-weight:700;}
  .primary{background:var(--lime);color:#101214;border:none;}
  .ghost{background:none;border:1px solid var(--line);color:var(--text);}
  .danger{color:var(--danger);border-color:var(--danger);background:none;}
  #gate, #denied{display:flex;flex-direction:column;align-items:flex-start;gap:14px;}
  #denied{display:none;}
  #panel{display:none;}
  .empty{color:var(--text-dim);font-size:13px;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .toolbar .ghost{padding:8px 14px;font-size:12.5px;}
  .table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;}
  table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap;}
  th{text-align:left;color:var(--text-dim);font-weight:600;font-size:11px;letter-spacing:.3px;text-transform:uppercase;
    padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface2);}
  td{padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .name{font-weight:700;}
  .email{color:var(--text-dim);font-size:12px;margin-top:1px;}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;}
  .pill.active{background:rgba(130,214,155,.14);color:var(--success);}
  .pill.revoked{background:rgba(240,130,112,.14);color:var(--danger);}
  .pill.pro{background:rgba(217,164,65,.14);color:var(--amber);}
  .pill.free{background:var(--surface2);color:var(--text-dim);}
  .muted{color:var(--text-dim);}
  .actions{display:flex;gap:6px;flex-wrap:wrap;}
  .actions button{padding:6px 12px;font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <div id="gate">
    <h1>Admin</h1>
    <button class="primary" id="signInBtn">Sign in with Google</button>
  </div>

  <div id="denied">
    <h1>Not authorized</h1>
    <p class="sub">This account does not have access to this page.</p>
    <button class="ghost" id="signOutBtnDenied">Sign out</button>
  </div>

  <div id="panel">
    <div class="toolbar">
      <div>
        <h1>Users</h1>
        <p class="sub" style="margin-bottom:0;">Overview, plan, activity, and AI Coach usage — click Refresh to reload the stat columns.</p>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="ghost" id="refreshBtn">Refresh stats</button>
        <button class="ghost" id="signOutBtn">Sign out</button>
      </div>
    </div>
    <div id="userList"><div class="empty">Loading…</div></div>
  </div>
</div>

<script>
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();
const ADMIN_EMAIL = 'sokratispoun@gmail.com';
const WORKER_URL = 'https://programma-ai.sokratispoun.workers.dev';

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function utcDateKey(d){ return (d||new Date()).toISOString().slice(0,10); }
function formatDate(ts){
  if(!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric'});
}
function formatRelative(ms){
  if(!ms) return 'Never';
  const diff = Date.now() - ms;
  const min = Math.floor(diff/60000);
  if(min < 1) return 'Just now';
  if(min < 60) return min+'m ago';
  const hr = Math.floor(min/60);
  if(hr < 24) return hr+'h ago';
  const day = Math.floor(hr/24);
  if(day < 30) return day+'d ago';
  return formatDate(ms);
}

document.getElementById('signInBtn').addEventListener('click', ()=>{
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>console.error(e));
});
document.getElementById('signOutBtn').addEventListener('click', ()=>auth.signOut());
document.getElementById('signOutBtnDenied').addEventListener('click', ()=>auth.signOut());

let currentUser = null;
let usersUnsub = null;
let latestAccessDocs = [];

auth.onAuthStateChanged(user=>{
  currentUser = user;
  document.getElementById('gate').style.display = 'none';
  document.getElementById('denied').style.display = 'none';
  document.getElementById('panel').style.display = 'none';
  if(usersUnsub){ usersUnsub(); usersUnsub = null; }

  if(!user){
    document.getElementById('gate').style.display = 'flex';
    return;
  }
  if(user.email !== ADMIN_EMAIL){
    document.getElementById('denied').style.display = 'flex';
    return;
  }
  document.getElementById('panel').style.display = 'block';
  watchUserList();
});

document.getElementById('refreshBtn').addEventListener('click', ()=>renderTable(latestAccessDocs));

// Same users/{uid}/data cleanup the self-service delete flow uses —
// Firestore rules let the admin act on any uid, not just their own.
async function deleteAllUserData(uid){
  const dataCol = db.collection('users').doc(uid).collection('data');
  const dataSnap = await dataCol.get();
  const docs = dataSnap.docs;
  const chunkSize = 400; // stay well under Firestore's 500-write batch limit
  for(let i=0; i<docs.length; i+=chunkSize){
    const batch = db.batch();
    docs.slice(i, i+chunkSize).forEach(d=>batch.delete(d.ref));
    await batch.commit();
  }
  try{ await db.collection('users').doc(uid).delete(); }catch(e){ /* implicit doc, fine if missing */ }
  await db.collection('access').doc(uid).delete();
}

// Deletes the Firebase Auth sign-in record itself, which no client SDK can
// do for anyone but the signed-in user — goes through the Cloudflare Worker
// (service account), which independently re-verifies this really is the
// admin's own ID token before touching anything.
async function adminDeleteUser(uid, btn){
  if(!confirm('This will PERMANENTLY delete this user\'s account and all their data. This cannot be undone.')) return;
  btn.disabled = true;
  try{
    await deleteAllUserData(uid);
  }catch(e){
    console.error('admin delete: user data cleanup failed', e);
    alert('Something went wrong deleting the user\'s data. Please try again.');
    btn.disabled = false;
    return;
  }
  try{
    const idToken = await currentUser.getIdToken();
    const res = await fetch(WORKER_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'admin-delete-user', idToken, targetUid: uid }),
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok || !data.ok){
      console.error('admin delete: auth record cleanup failed', data);
      alert('The data was deleted, but the sign-in account itself was not (a server-side problem). Try again or check the Worker setup.');
    }
  }catch(e){
    console.error('admin delete: worker call failed', e);
    alert('The data was deleted, but the sign-in account itself was not (a server-side problem). Try again or check the Worker setup.');
  }
  // The onSnapshot below already drops this row once its doc is gone
  // (deleted as part of deleteAllUserData) — nothing else to refresh here.
}

// Surface-level per-user stats for the dashboard — plan, sign-up already
// comes from the access doc; this fills in subscription/credits/AI usage,
// each a best-effort read (a missing doc just means "no data yet", not an
// error). The lifetime AI-message total isn't stored as one number anywhere
// (see anthropic-proxy.js's daily ai-usage:* docs) — it's summed here from
// every 'ai-usage:*' doc via a document-ID range query, since those ids all
// share that prefix and sort lexicographically right after it.
async function loadUserStats(uid){
  const dataCol = db.collection('users').doc(uid).collection('data');
  const [subSnap, creditsSnap, lastActiveSnap, usageSnap] = await Promise.all([
    dataCol.doc('subscription').get().catch(()=>null),
    dataCol.doc('credits').get().catch(()=>null),
    dataCol.doc('last-active').get().catch(()=>null),
    dataCol.where(firebase.firestore.FieldPath.documentId(), '>=', 'ai-usage:')
           .where(firebase.firestore.FieldPath.documentId(), '<', 'ai-usage:~')
           .get().catch(()=>null),
  ]);
  const sub = subSnap && subSnap.exists ? subSnap.data() : null;
  const isPro = !!(sub && sub.status === 'active' && sub.currentPeriodEnd && sub.currentPeriodEnd*1000 > Date.now());
  const isComp = isPro && !!sub.grantedByAdmin;
  const credits = creditsSnap && creditsSnap.exists ? (creditsSnap.data().balance || 0) : 0;
  const lastActiveAt = lastActiveSnap && lastActiveSnap.exists ? lastActiveSnap.data().at : null;
  let todayCount = 0, totalCount = 0;
  if(usageSnap){
    const todayId = 'ai-usage:' + utcDateKey();
    usageSnap.forEach(d=>{
      const c = (d.data().count) || 0;
      totalCount += c;
      if(d.id === todayId) todayCount = c;
    });
  }
  return { isPro, isComp, credits, lastActiveAt, todayCount, totalCount, periodEnd: sub && sub.currentPeriodEnd };
}

// Manual "give this person free Pro" toggle — goes through the Worker (see
// admin-set-plan in anthropic-proxy.js) since only the service account can
// write the subscription doc. Revoking is refused server-side if the user
// has turned out to have a real Stripe subscription in the meantime, so
// this can't accidentally cancel something someone is actually paying for.
async function adminSetPlan(uid, grant, btn){
  if(grant && !confirm('Grant this user a free Pro plan (no payment)? You can revoke it anytime.')) return;
  if(!grant && !confirm('Revoke this user\'s free Pro plan? They will drop back to the free tier.')) return;
  btn.disabled = true;
  try{
    const idToken = await currentUser.getIdToken();
    const res = await fetch(WORKER_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'admin-set-plan', idToken, targetUid: uid, grant }),
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok || !data.ok){
      if(data.error === 'has_real_subscription'){
        alert('This user has a real, paid subscription — revoke it from the Stripe dashboard instead.');
      }else{
        alert('Something went wrong changing this user\'s plan. Please try again.');
      }
      btn.disabled = false;
      return;
    }
    const row = btn.closest('tr');
    if(row) loadUserStats(uid).then(stats=>updatePlanCell(row, stats));
  }catch(e){
    console.error('admin set plan failed', e);
    alert('Something went wrong changing this user\'s plan. Please try again.');
    btn.disabled = false;
  }
}

function updatePlanCell(row, stats){
  const planCell = row.querySelector('.stat-plan');
  planCell.className = 'stat-plan';
  const uid = row.dataset.uid;
  if(stats.isComp){
    planCell.innerHTML = `<span class="pill pro">Pro (comp)</span>
      <div style="margin-top:6px;"><button class="ghost" type="button" data-revoke-pro="${escapeHtml(uid)}" style="padding:4px 10px;font-size:11px;">Revoke</button></div>`;
  }else if(stats.isPro){
    planCell.innerHTML = `<span class="pill pro">Pro (paid)</span>`;
  }else{
    planCell.innerHTML = `<span class="pill free">Free</span>${stats.credits>0 ? ` <span class="muted">+${stats.credits} credits</span>` : ''}
      <div style="margin-top:6px;"><button class="ghost" type="button" data-grant-pro="${escapeHtml(uid)}" style="padding:4px 10px;font-size:11px;">Grant free Pro</button></div>`;
  }
  const grantBtn = planCell.querySelector('[data-grant-pro]');
  if(grantBtn) grantBtn.addEventListener('click', ()=>adminSetPlan(uid, true, grantBtn));
  const revokeBtn = planCell.querySelector('[data-revoke-pro]');
  if(revokeBtn) revokeBtn.addEventListener('click', ()=>adminSetPlan(uid, false, revokeBtn));
}

function watchUserList(){
  if(usersUnsub) return;
  usersUnsub = db.collection('access').onSnapshot(snap=>{
    const docs = [];
    snap.forEach(doc=>{
      if(doc.id === (currentUser && currentUser.uid)) return; // don't let the admin ban themselves
      docs.push(doc);
    });
    latestAccessDocs = docs;
    renderTable(docs);
  }, err=>console.error('user list watch error', err));
}

function renderTable(docs){
  const el = document.getElementById('userList');
  if(!docs.length){ el.innerHTML = '<div class="empty">No users yet.</div>'; return; }
  el.innerHTML = `<div class="table-scroll"><table>
    <thead><tr>
      <th>Member</th><th>Access</th><th>Plan</th><th>Signed up</th><th>Last active</th><th>AI msgs (today / total)</th><th></th>
    </tr></thead>
    <tbody>${docs.map(doc=>{
      const d = doc.data();
      const denied = d.status === 'denied';
      return `<tr data-uid="${escapeHtml(doc.id)}">
        <td><div class="name">${escapeHtml(d.name || d.email || doc.id)}</div><div class="email">${escapeHtml(d.email||'')}</div></td>
        <td><span class="pill ${denied?'revoked':'active'}">${denied?'No access':'Active'}</span></td>
        <td class="stat-plan muted">…</td>
        <td>${formatDate(d.requestedAt)}</td>
        <td class="stat-active muted">…</td>
        <td class="stat-ai muted">…</td>
        <td>
          <div class="actions">
            ${denied
              ? `<button class="primary" type="button" data-approve="${escapeHtml(doc.id)}">Restore</button>`
              : `<button class="ghost" type="button" data-deny="${escapeHtml(doc.id)}">Revoke</button>`}
            <button class="danger" type="button" data-delete="${escapeHtml(doc.id)}">Delete</button>
          </div>
        </td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>`;

  el.querySelectorAll('[data-approve]').forEach(b=>{
    b.addEventListener('click', ()=>db.collection('access').doc(b.dataset.approve).update({status:'approved'}).catch(e=>console.error(e)));
  });
  el.querySelectorAll('[data-deny]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(!confirm('This user will lose access to the app. Continue?')) return;
      db.collection('access').doc(b.dataset.deny).update({status:'denied'}).catch(e=>console.error(e));
    });
  });
  el.querySelectorAll('[data-delete]').forEach(b=>{
    b.addEventListener('click', ()=>adminDeleteUser(b.dataset.delete, b));
  });

  // Stat columns load separately (several reads per user) so the access
  // list itself never waits on them, and one user's slow/failed read
  // doesn't hold up anyone else's row.
  docs.forEach(doc=>{
    const row = el.querySelector(`tr[data-uid="${CSS.escape(doc.id)}"]`);
    if(!row) return;
    loadUserStats(doc.id).then(stats=>{
      updatePlanCell(row, stats);
      row.querySelector('.stat-active').textContent = formatRelative(stats.lastActiveAt);
      row.querySelector('.stat-active').classList.remove('muted');
      row.querySelector('.stat-ai').textContent = `${stats.todayCount} / ${stats.totalCount}`;
      row.querySelector('.stat-ai').classList.remove('muted');
    }).catch(e=>console.error('stats load failed for', doc.id, e));
  });
}
</script>
</body>
</html>
